# Global events block
events {
    worker_connections 1024; # Maximum number of connections per worker
}

# HTTP server block
http {
    # Logging settings
    log_format main_timed '$remote_addr - $remote_user [$time_iso8601] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main_timed;
    error_log /var/log/nginx/error.log;

    # Gzip compression for improved performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Server block
    server {
        listen 80;
        server_name mycoolcv-verse.duckdns.org; # Replace with your domain or IP

        # Location for serving Flask app
        location / {
            proxy_pass http://flask_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Flask handle error pages
            error_page 404 = /error/404;
            error_page 500 502 503 504 = /error/500;

            # Timeout settings for the backend
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
            proxy_redirect off;

            # Enable WebSocket support (if your Flask app uses it)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}